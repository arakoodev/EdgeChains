name: Validate SmartRouter refresh

on:
  push:
    branches:
      - codex/edgechains-smart-router-286

permissions:
  contents: write

jobs:
  validate:
    if: github.repository == 'yanruiyang517/EdgeChains'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/edgechains-smart-router-286

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: JS/edgechains/arakoodev/package-lock.json

      - name: Install dependencies
        working-directory: JS/edgechains/arakoodev
        run: npm install

      - name: Format refreshed files
        working-directory: JS/edgechains/arakoodev
        run: |
          node node_modules/prettier/bin/prettier.cjs --write \
            src/ai/src/lib/router/smartRouter.ts \
            src/ai/src/lib/openai/openai.ts \
            src/ai/src/tests/providerPayloadRegression.test.ts

      - name: Run focused test suites
        working-directory: JS/edgechains/arakoodev
        run: |
          node node_modules/jest/bin/jest.js \
            src/ai/src/tests/smartRouter.test.ts \
            src/ai/src/tests/smartRouterReliability.test.ts \
            src/ai/src/tests/providerPayloadRegression.test.ts \
            src/ai/src/tests/openAiEndpoints.test.ts \
            src/ai/src/tests/streaming.test.ts \
            --runInBand

      - name: Run TypeScript build
        working-directory: JS/edgechains/arakoodev
        run: node node_modules/typescript/bin/tsc -b

      - name: Check formatting
        working-directory: JS/edgechains/arakoodev
        run: |
          node node_modules/prettier/bin/prettier.cjs --check \
            src/ai/src/lib/router/smartRouter.ts \
            src/ai/src/lib/openai/openai.ts \
            src/ai/src/tests/providerPayloadRegression.test.ts

      - name: Commit formatting and remove temporary workflow
        run: |
          rm .github/workflows/validate-smart-router-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: finalize SmartRouter validation"
            git push origin HEAD:codex/edgechains-smart-router-286
          fi
