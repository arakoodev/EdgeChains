name: EC2 Next.js Tests
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "ec-2/**"
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [nextjs-chat-template, nexusflow]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
      - name: Start Redis
        uses: supercharge/redis-github-action@1.6.0
        with:
          redis-version: 7-alpine
      - name: Install dependencies
        run: npm install
        working-directory: ec-2/${{ matrix.project }}
      - name: Run tests
        run: npm test -- --run
        working-directory: ec-2/${{ matrix.project }}
