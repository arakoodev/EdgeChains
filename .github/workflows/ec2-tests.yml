name: EC2 Next.js Tests
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "ec-2/**"
      - ".github/workflows/ec2-tests.yml"
  push:
    branches: [ rsc ]
    paths:
      - "ec-2/**"
      - ".github/workflows/ec2-tests.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        project: [nexusflow]
    env:
      REDIS_URL: redis://127.0.0.1:6379
      DATABASE_URL: postgresql://testuser:testpass@127.0.0.1:5432/testdb
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('ec-2/${{ matrix.project }}/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci
        working-directory: ec-2/${{ matrix.project }}
      - name: Run tests
        run: npm run test:ci
        working-directory: ec-2/${{ matrix.project }}
