name: EC2 Next.js Tests
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "ec-2/**"
      - ".github/workflows/ec2-tests.yml"
  push:
    branches: [ rsc ]
    paths:
      - "ec-2/**"
      - ".github/workflows/ec2-tests.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [nexusflow]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexusflow
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexusflow
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('ec-2/${{ matrix.project }}/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci
        working-directory: ec-2/${{ matrix.project }}
      - name: Run database migrations
        run: npm run migrate
        working-directory: ec-2/${{ matrix.project }}
      - name: Run unit tests (worker imports, basic functionality)
        run: npm run test:unit
        working-directory: ec-2/${{ matrix.project }}
      - name: Run integration tests with GitHub services
        run: npm run test:ci
        working-directory: ec-2/${{ matrix.project }}
      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v6
        with:
          working-directory: ec-2/${{ matrix.project }}
          build: npm run migrate
          start: npm run start:e2e
          wait-on: 'http://localhost:3000'
          wait-on-timeout: 120
          browser: chrome
          spec: cypress/e2e/merge-node-workflow.cy.js
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nexusflow
          REDIS_URL: redis://localhost:6379
