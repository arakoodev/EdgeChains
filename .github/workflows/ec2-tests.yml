name: EC2 Next.js Tests
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "ec-2/**"
      - ".github/workflows/ec2-tests.yml"
  push:
    branches: [ rsc ]
    paths:
      - "ec-2/**"
      - ".github/workflows/ec2-tests.yml"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [nexusflow]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('ec-2/${{ matrix.project }}/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install dependencies
        run: npm ci
        working-directory: ec-2/${{ matrix.project }}
      - name: Run unit tests (worker imports, basic functionality)
        run: npm run test:unit
        working-directory: ec-2/${{ matrix.project }}
      - name: Run integration tests with all-in-one container
        run: npm run test:integration
        working-directory: ec-2/${{ matrix.project }}
